  earlier:
  - question: How do I authenticate to the Campaigns API?
    answer: 'Send the header `Authorization: Bearer <token>`.'
    references:
    - doc: campaigns_api
      snippet: |-
        Returns at most 100 campaigns per page. Use the `page` parameter to get the next page.

        ## Authentication
        Send the header `Authorization: Bearer <token>`.

        ## Rate limits
        10 requests per second per token. HTTP 429 means the limit was exceeded: wait for the number of seconds in the `Retry-After` header, then retry.
