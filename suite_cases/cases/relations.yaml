- id: bq-follow-up
  part: HELD_OUT
  reviewed: false
  earlier:
  - question: Which columns does analytics.impressions_daily have?
    answer: day, advertiser_hash, impressions, clicks and spend_usd.
    references:
    - doc: bq_impressions
      snippet: |-
        Daily impressions per advertiser. Partitioned by `day`; every query must filter on `day`.

        ## Columns
        - day DATE
        - advertiser_hash STRING
        - impressions INT64
        - clicks INT64
        - spend_usd NUMERIC

        ## Retention
        Data is kept for 400 days.
    stage1:
      relation: FIRST
      relevance: 5
      primary_failure: NONE
  turn:
