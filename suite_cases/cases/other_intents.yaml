- id: general-task-incomplete
  part: TUNING
  reviewed: false
  turn:
    question: Write a Python function that returns the median of a list, and a unit test for it.
    answer: |-
      ```python
      def median(xs):
          s = sorted(xs)
          n = len(s)
          mid = n // 2
          return s[mid] if n % 2 else (s[mid - 1] + s[mid]) / 2
      ```
  expected:
    stage1:
      intent: GENERAL_TASK
      relation: FIRST
      relevance: 5
      completeness: 3
      clarity: 5
      failure_types: [INCOMPLETE_ANSWER]
      primary_failure: INCOMPLETE_ANSWER
      severity: MEDIUM
