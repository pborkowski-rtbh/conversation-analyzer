# The suite's corpus: made-up documents in the shape of our data stores. Searches in a case return the documents it
# lists; reading a document returns its text. Facts here are invented; only their consistency matters.
leave:
  doc_id: sites_google_com_rtbhouse_com_hr-house_leave
  data_store: rtb-crj-hr-house
  uri: https://sites.google.com/rtbhouse.com/hr-house/leave
  title: Leave policy (2026)
  text: |
    # Leave policy (2026)

    ## Annual leave
    Employees with less than 10 years of seniority have 20 days of annual leave per year; from 10 years on, 26 days.
    Request annual leave in Workday at least 3 working days in advance.
    Unused days can be taken until 30 September of the next year.

    ## On-demand leave
    You can take up to 4 days of on-demand leave per year. They are taken from your annual leave.
    Request on-demand leave in Workday no later than the start of the working day.

    ## Sick leave
    Sick leave is confirmed with an electronic sick note (e-ZLA). Inform your manager on the first day of absence.
leave_2024:
  doc_id: confluence_HR_88_v7
  data_store: rtb-crj-confluence
  uri: https://rtbhouseproduct.atlassian.net/wiki/spaces/HR/pages/88
  title: Leave rules (2024)
  text: |
    # Leave rules (2024)

    Last updated: March 2024.

    ## On-demand leave
    You can take up to 6 days of on-demand leave per year. Request it by e-mail to your manager.

    ## Annual leave
    Request annual leave at least 7 days in advance.
leave_pl:
  doc_id: sites_google_com_rtbhouse_com_hr-house_urlopy
  data_store: rtb-crj-hr-house
  uri: https://sites.google.com/rtbhouse.com/hr-house/urlopy
  title: Urlopy (2026)
  text: |
    # Urlopy (2026)

    ## Urlop wypoczynkowy
    Pracownik ze stażem krótszym niż 10 lat ma 20 dni urlopu w roku, od 10 lat – 26 dni.
    Wniosek składamy w Workday co najmniej 3 dni robocze wcześniej.

    ## Urlop na żądanie
    Przysługują maksymalnie 4 dni urlopu na żądanie w roku, w ramach urlopu wypoczynkowego.
    Zgłoś go w Workday najpóźniej przed rozpoczęciem pracy w dniu nieobecności.
trips:
  doc_id: confluence_TRAVEL_120_v12
  data_store: rtb-crj-confluence
  uri: https://rtbhouseproduct.atlassian.net/wiki/spaces/TRAVEL/pages/120
  title: Business trips (2026)
  text: |
    # Business trips (2026)

    ## Booking
    Book every business trip in Travel Tool. Book hotels through Travel Tool as well.

    ## Approval
    Trips inside Europe need your manager's approval. Trips outside Europe also need approval from Finance.

    ## Expenses
    Settle your expenses in Travel Tool within 14 days after the trip. Keep the receipt of every expense above 20 EUR.
