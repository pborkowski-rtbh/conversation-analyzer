vpn:
  doc_id: sites_google_com_rtbhouse_com_hdqa_vpn
  data_store: rtb-crj-helpdesk-qa
  uri: https://sites.google.com/rtbhouse.com/hdqa/vpn
  title: VPN
  text: |
    # VPN

    Use GlobalProtect with the portal vpn.rtbhouse.net. Sign in with your Google account and confirm with Okta Verify.

    ## Troubleshooting
    If GlobalProtect shows "Gateway not responding", switch the gateway to Europe-2 and reconnect.
    If the sign-in loops, reset GlobalProtect: Settings > Troubleshooting > Reset.
    If it still fails, open a ticket in the IT Helpdesk queue in OTRS.
