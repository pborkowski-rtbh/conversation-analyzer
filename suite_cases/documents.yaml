laptop:
  doc_id: knowhow_post_150
  data_store: rtb-crj-knowhow
  uri: https://knowhow.rtbhouse.com/posts/150
  title: Getting a new laptop
  text: |
    # Getting a new laptop

    ## Steps
    1. Open a request in Jira Service Desk with the type Hardware.
    2. Your manager approves the request.
    3. IT prepares the laptop within 5 working days.
    4. Pick it up at the IT desk on the 3rd floor.

    ## Returning the old laptop
    Return the old laptop to the IT desk within 10 working days.
campaigns_api:
  doc_id: web_api_campaigns_list
  data_store: rtb-crj-api-docs
  uri: https://api.rtbhouse.com/docs/campaigns
  title: Campaigns API
  text: |
    # GET /v5/advertisers/{hash}/campaigns

    Returns at most 100 campaigns per page. Use the `page` parameter to get the next page.

    ## Authentication
    Send the header `Authorization: Bearer <token>`.

    ## Rate limits
    10 requests per second per token. HTTP 429 means the limit was exceeded: wait for the number of seconds in the
    `Retry-After` header, then retry.
bq_impressions:
  doc_id: bq_doc_analytics_impressions_daily
  data_store: rtb-crj-bq-documentation
  uri: https://console.cloud.google.com/bigquery?d=analytics&t=impressions_daily
  title: analytics.impressions_daily
  text: |
    # analytics.impressions_daily

    Daily impressions per advertiser. Partitioned by `day`; every query must filter on `day`.

    ## Columns
    - day DATE
    - advertiser_hash STRING
    - impressions INT64
    - clicks INT64
    - spend_usd NUMERIC

    ## Retention
    Data is kept for 400 days.
bq_clicks:
  doc_id: bq_doc_analytics_clicks_hourly
  data_store: rtb-crj-bq-documentation
  uri: https://console.cloud.google.com/bigquery?d=analytics&t=clicks_hourly
  title: analytics.clicks_hourly
  text: |
    # analytics.clicks_hourly

    Hourly clicks per campaign. Partitioned by `hour`.

    ## Columns
    - hour TIMESTAMP (UTC)
    - campaign_id STRING
    - clicks INT64
    - conversions INT64

    A click is counted once per user and campaign within 30 seconds.
