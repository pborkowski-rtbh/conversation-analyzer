# Opens or closes stage's run gate (deployment-plan.md §3): writes {"open_until": ...} to the control object.
# The Actions history is the audit trail of who opened stage and for how long. Moves to the official repo in step 3;
# the Workload Identity provider and the service account come from repository variables set there.
name: stage-gate

on:
  workflow_dispatch:
    inputs:
      action:
        description: resume or pause
        type: choice
        options: [resume, pause]
        default: resume
      hours:
        description: Hours to stay open (1-24, resume only)
        type: number
        default: 2

permissions:
  contents: read
  id-token: write

concurrency:
  group: stage-gate

env:
  GATE_URI: gs://rtb-aiel-core-stage-quality-control/run-gate.json

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Compute open_until
        id: until
        env:
          ACTION: ${{ inputs.action }}
          HOURS: ${{ inputs.hours }}
        run: |
          if [ "$ACTION" = resume ]; then
            [[ "$HOURS" =~ ^[0-9]+$ ]] && (( HOURS >= 1 && HOURS <= 24 )) || { echo "hours must be 1-24"; exit 1; }
            until=$(date -u -d "+${HOURS} hours" +%Y-%m-%dT%H:%M:%S+00:00)
          else
            until=$(date -u -d "-1 minute" +%Y-%m-%dT%H:%M:%S+00:00)
          fi
          echo "open_until=$until" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.STAGE_WIF_PROVIDER }}
          service_account: ${{ vars.STAGE_GATE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Write the control object
        env:
          OPEN_UNTIL: ${{ steps.until.outputs.open_until }}
        run: |
          printf '{"open_until": "%s"}' "$OPEN_UNTIL" > run-gate.json
          gcloud storage cp run-gate.json "$GATE_URI" --content-type=application/json
          echo "stage ${{ inputs.action }}: open_until $OPEN_UNTIL" >> "$GITHUB_STEP_SUMMARY"
