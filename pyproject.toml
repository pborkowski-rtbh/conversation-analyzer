[project]
name = "conversation-analyzer"
version = "0.1.0"
description = "Automated quality assessment of Bolek's answers, from derived values only (AIENGLAB-782)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "click>=8.1",
    "cryptography>=43",
    "google-auth>=2.35",
    "google-cloud-bigquery>=3.27",
    "google-cloud-secret-manager>=2.21",
    "google-cloud-storage>=2.18",
    "google-genai>=1.0",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "sentry-sdk>=2.17",
]

[project.scripts]
ca = "conversation_analyzer.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/conversation_analyzer"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "emulator: needs the docker compose stack (make up)",
    "live: calls paid Vertex AI models",
]
addopts = "-m 'not live'"

[tool.coverage.run]
source = ["src/conversation_analyzer"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = ["if __name__ == .__main__.:", "raise NotImplementedError"]
