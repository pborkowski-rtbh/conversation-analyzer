# Local runs and tests against the docker compose stack (make up): emulator, fake GCS, stubs. CA_ENV=local.
projects:
  write: local-project
  log: local-project
  evals: local-project
dataset_prefix: ""
secrets:
  project: local-project                # CA_SECRETS_BACKEND=env: the values come from CA_SECRET_* variables
judge:
  vertex_project: rtb-ai-engineering-indexers   # only the paid suite (make suite-live) reaches it
  daily_token_limit: 60000000
alerts:
  quality_channel: "#bolek-quality"     # the Slack stub
  alerts_channel: "#aiel-alerts"
people_directory:
  map_uri: gs://local-indexers-state/directory/associates-departments.json
run_gate:
  uri: null                             # always open; tests point it at fake GCS
